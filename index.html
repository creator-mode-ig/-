<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Creator">
<meta name="theme-color" content="#000000">
<title>Creator Mode</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: #000;
    color: #f5f5f5;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  a {
    text-decoration: none;
    color: inherit;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ── Top nav bar ── */
  .top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    padding-top: max(10px, calc(env(safe-area-inset-top) + 6px));
    flex-shrink: 0;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    transition: opacity 0.12s;
  }
  .nav-btn:active { opacity: 0.4; }
  .nav-btn svg {
    fill: none;
    stroke: #f5f5f5;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .logo-text {
    font-family: 'Grand Hotel', cursive;
    font-size: 27px;
    font-weight: 400;
    color: #f5f5f5;
  }

  /* Edits icon button */
  .edits-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, #FF6B35, #E1306C, #833AB4);
    transition: transform 0.12s, opacity 0.12s;
    box-shadow: 0 2px 10px rgba(225,48,108,0.2);
  }
  .edits-btn:active {
    transform: scale(0.88);
    opacity: 0.8;
  }
  .edits-btn svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: white;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ── Story circle section ── */
  .story-section {
    padding: 8px 16px 16px;
    flex-shrink: 0;
  }

  .story-circle-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 72px;
    position: relative;
  }

  .story-circle-link {
    position: relative;
    width: 66px;
    height: 66px;
    display: block;
  }

  .story-ring {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    border: 2px solid #444;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #1a1a1a;
  }

  .story-ring svg {
    width: 28px;
    height: 28px;
    stroke: #888;
    stroke-width: 1.5;
    fill: none;
  }

  .story-plus-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #0095f6;
    border: 2.5px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .story-plus-badge svg {
    width: 12px;
    height: 12px;
    stroke: #fff;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
  }

  .story-label {
    font-size: 11px;
    color: #aaa;
    letter-spacing: -0.1px;
  }

  .story-circle-link:active .story-ring {
    opacity: 0.6;
  }

  /* ── Content area (empty black) ── */
  .content {
    flex: 1;
  }

  /* ── Bottom nav bar ── */
  .bottom-nav {
    display: flex;
    align-items: center;
    /* CAMBIO: Usamos space-between para distribuir izquierda-centro-derecha */
    justify-content: space-between; 
    padding: 10px 16px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    flex-shrink: 0;
    border-top: 1px solid #1c1c1c;
  }

  .dm-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 44px;
    transition: opacity 0.12s;
  }
  .dm-btn:active { opacity: 0.4; }
  .dm-btn svg {
    fill: none;
    stroke: #f5f5f5;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>

<div class="top-nav">
  <a class="nav-btn" href="instagram://camera">
    <svg width="26" height="26" viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </a>
  <span class="logo-text">Creator Mode</span>
  <div style="width: 44px;"></div>
</div>

<div class="story-section">
  <div class="story-circle-wrap">
    <a class="story-circle-link" href="instagram://story-camera">
      <div class="story-ring">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="story-plus-badge">
        <svg viewBox="0 0 12 12">
          <line x1="6" y1="2" x2="6" y2="10"/>
          <line x1="2" y1="6" x2="10" y2="6"/>
        </svg>
      </div>
    </a>
    <span class="story-label">Tu historia</span>
  </div>
</div>

<div class="content"></div>

<div class="bottom-nav">
  <div style="width: 34px;"></div>

  <a class="dm-btn" href="instagram://direct-inbox">
    <svg width="26" height="26" viewBox="0 0 24 24">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22,2 15,22 11,13 2,9" stroke-linejoin="round"/>
    </svg>
  </a>

  <a class="edits-btn" href="shortcuts://run-shortcut?name=Edits">
    <svg viewBox="0 0 24 24">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </svg>
  </a>
</div>

</body>
</html>
